<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Scripts • MemoriseALLOFIT</title><link rel="stylesheet" href="./styles.css"></head><body><header class="mobile-top"><a class="brand" href="app.html"><span class="logo">M</span><span>Memorise<span>ALLOFIT</span></span></a></header><main class="page narrow"><div class="page-head"><div><p class="eyebrow">ADVANCED</p><h1>Script & chunks</h1><p class="muted">Break long material into manageable rehearsal pieces.</p></div></div><section class="card form-card"><label>Choose a memorisation<select id="memory"></select></label><div id="chunks"></div><button id="split" class="btn btn-secondary">Split into chunks</button><button id="save" class="btn btn-primary">Save chunks</button></section></main><script src="js/storage.js"></script><script>const sel=document.querySelector("#memory"),db=loadDB();sel.innerHTML=db.memories.map(m=>`<option value="${m.id}">${m.title}</option>`).join("");function draw(){const m=getMemory(sel.value);if(!m)return;document.querySelector("#chunks").innerHTML=(m.chunks||m.text.split(/\\n+/)).map((x,i)=>`<label>Chunk ${i+1}<textarea class="chunk-input" rows="4">${x}</textarea></label>`).join("")}sel.onchange=draw;document.querySelector("#split").onclick=()=>{document.querySelectorAll(".chunk-input").forEach(x=>{});const m=getMemory(sel.value),words=m.text.split(/\\s+/),size=Math.max(30,Math.ceil(words.length/5));m.chunks=[];for(let i=0;i<words.length;i+=size)m.chunks.push(words.slice(i,i+size).join(" "));draw()};document.querySelector("#save").onclick=()=>{updateMemory(sel.value,{chunks:[...document.querySelectorAll(".chunk-input")].map(x=>x.value.trim()).filter(Boolean)});alert("Chunks saved.")};draw()</script></body></html>
