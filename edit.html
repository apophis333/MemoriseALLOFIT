<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Edit • MemoriseALLOFIT</title><link rel="stylesheet" href="./styles.css"></head><body><header class="mobile-top"><a class="brand" href="library.html"><span class="logo">M</span><span>Memorise<span>ALLOFIT</span></span></a></header><main class="page narrow"><div class="page-head"><div><p class="eyebrow">EDIT</p><h1>Edit memorisation</h1></div></div><form id="editForm" class="card form-card"><label>Title<input id="title" required></label><label>Category<select id="category"><option>School</option><option>Speech</option><option>Language</option><option>Script</option><option>Personal</option><option>Other</option></select></label><label>Text<textarea id="text" rows="14" required></textarea></label><div class="form-row"><label>Target date<input id="deadline" type="date"></label><label>Colour<select id="colour"><option value="violet">Violet</option><option value="blue">Blue</option><option value="green">Green</option><option value="orange">Orange</option><option value="pink">Pink</option></select></label></div><div class="form-actions"><a class="btn btn-ghost" href="library.html">Cancel</a><button class="btn btn-primary">Save changes</button></div></form></main><script src="js/storage.js"></script><script>const id=new URLSearchParams(location.search).get("id"),m=getMemory(id);if(!m)location.href="library.html";else{title.value=m.title;text.value=m.text;category.value=m.category;deadline.value=m.deadline;colour.value=m.colour;editForm.onsubmit=e=>{e.preventDefault();updateMemory(id,{title:title.value.trim(),text:text.value.trim(),category:category.value,deadline:deadline.value,colour:colour.value});location.href="library.html"}}</script></body></html>
